name: Windows validation and package
on:
  push:
    branches:
      - feature/retail-super-upgrades
  pull_request:
    branches:
      - main
jobs:
  windows-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Create isolated environment
        run: python -m venv .venv
      - name: Install declared packages
        run: .venv\Scripts\python.exe -m pip install -r requirements.txt -r requirements-build.txt
      - name: Compile Python sources
        run: .venv\Scripts\python.exe -m compileall -q .
      - name: Verify dependency health in isolation
        run: .venv\Scripts\python.exe -m pip check
      - name: Build one-folder executable
        run: .venv\Scripts\python.exe -m PyInstaller --clean --noconfirm --windowed --onedir --name "NextGen ERP" main.py
